<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | Shakib Uz Zaman</title>
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="../../pages/asset/js/background.js" defer></script>
    <style>
        html {
            scrollbar-gutter: stable;
        }

        ::selection {
            background-color: #ff7500;
            color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Inter", sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        main {
            flex: 1;
            width: min(700px, 80%);
            margin: 40px auto 70px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #b0b0b0;
            text-decoration: none;
            margin-bottom: 30px;
            transition: color 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .sponsor-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            height: 35px;
        }

        .tab-link {
            background: none;
            border: none;
            color: #71717a;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s ease;
            font-family: inherit;
        }

        .tab-link.active {
            color: #ffffff;
            font-weight: 600;
        }

        .tab-divider {
            color: #18181b;
            font-size: 1.1rem;
            user-select: none;
        }

        .view-content {
            display: none;
            width: 100%;
        }

        .view-content.active {
            display: block;
        }

        .circles-cluster-container {
            position: relative;
            width: 100%;
            height: 450px;
        }

        .circles-inner-scale-box {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
        }

        .tiers-grid-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .tier-block {
            width: 100%;
            text-align: center;
        }

        .tier-block-title {
            color: #71717a;
            font-size: 0.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }

        .tier-block-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }

        .movie-circle-item {
            border-radius: 50%;
            background-color: #27272a;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border: 2px solid #18181b;
            opacity: 0.85;
            transition: border-color 0.15s ease, opacity 0.3s ease;
            position: absolute;
        }

        .movie-circle-item.loaded {
            opacity: 1;
        }

        .tier-block-items .movie-circle-item {
            position: relative;
        }

        .movie-circle-item.loaded:hover {
            border-color: #ff7500;
        }

        .flat-tooltip {
            position: fixed;
            background-color: #000000;
            border: 1px solid #18181b;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 9999;
            white-space: nowrap;
        }

        .tooltip-rating-badge {
            color: #ff7500;
            font-weight: 700;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            main {
                width: 88%;
                margin: 30px auto 50px;
            }

            .flat-tooltip {
                padding: 5px 8px;
                font-size: 0.72rem;
                border-radius: 4px;
            }
            .tooltip-rating-badge {
                margin-left: 4px;
            }
        }
    </style>
</head>
<body>

    <main>
        <a href="../../index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i><span>Back</span>
        </a>

        <section>
            <div class="sponsor-tabs">
                <button class="tab-link active" onclick="setSponsorTab('circles', this)">Movie Circles</button>
                <span class="tab-divider">|</span>
                <button class="tab-link" onclick="setSponsorTab('tiers', this)">Movie Tiers</button>
            </div>

            <div id="view-circles" class="view-content active">
                <div class="circles-cluster-container">
                    <div id="circles-inner-scale-box" class="circles-inner-scale-box"></div>
                </div>
            </div>

            <div id="view-tiers" class="view-content">
                <div class="tiers-grid-container">
                    <div class="tier-block">
                        <h3 class="tier-block-title">Loved It (9.0+)</h3>
                        <div id="tier-loved" class="tier-block-items"></div>
                    </div>
                    <div class="tier-block">
                        <h3 class="tier-block-title">Liked It (7.5 - 8.9)</h3>
                        <div id="tier-liked" class="tier-block-items"></div>
                    </div>
                    <div class="tier-block">
                        <h3 class="tier-block-title">Meh / Average (5.5 - 7.4)</h3>
                        <div id="tier-meh" class="tier-block-items"></div>
                    </div>
                    <div class="tier-block">
                        <h3 class="tier-block-title">Disliked It (4.0 - 5.4)</h3>
                        <div id="tier-disliked" class="tier-block-items"></div>
                    </div>
                    <div class="tier-block">
                        <h3 class="tier-block-title">Trash / Avoid (< 4.0)</h3>
                        <div id="tier-trash" class="tier-block-items"></div>
                    </div>
                </div>
            </div>

            <div id="movies-data-input" style="display: none;">
                <div class="movie-entry" data-tmdb-id="157336" data-my-rating="9.8"></div>
                <div class="movie-entry" data-tmdb-id="550" data-my-rating="9.5"></div>
                <div class="movie-entry" data-tmdb-id="27205" data-my-rating="9.1"></div>
                <div class="movie-entry" data-tmdb-id="155" data-my-rating="9.4"></div>
                <div class="movie-entry" data-tmdb-id="129" data-my-rating="8.9"></div>
                <div class="movie-entry" data-tmdb-id="496243" data-my-rating="8.5"></div>
                <div class="movie-entry" data-tmdb-id="244786" data-my-rating="8.2"></div>
                <div class="movie-entry" data-tmdb-id="11324" data-my-rating="7.8"></div>
                <div class="movie-entry" data-tmdb-id="546554" data-my-rating="7.4"></div>
                <div class="movie-entry" data-tmdb-id="284053" data-my-rating="7.0"></div>
                <div class="movie-entry" data-tmdb-id="335983" data-my-rating="6.5"></div>
                <div class="movie-entry" data-tmdb-id="415" data-my-rating="4.8"></div>
                <div class="movie-entry" data-tmdb-id="14164" data-my-rating="3.5"></div>
            </div>
        </section>
    </main>

    <div id="flat-tooltip" class="flat-tooltip"></div>

    <script>
        const API_KEY = "27af13baac123eb1faca1e068ccfb73d";
        let fetchedMovies = [];
        let activeTab = 'circles';

        function setSponsorTab(name, btn) {
            activeTab = name;
            document.querySelectorAll('.tab-link').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.view-content').forEach(v => v.classList.toggle('active', v.id === `view-${name}`));
            requestAnimationFrame(() => {
                name === 'circles' ? renderCirclesCluster() : renderTiersGrid();
            });
        }

        function getCircleRadius(r) {
            const v = parseFloat(r);
            return v >= 9 ? 56 : v >= 7.5 ? 44 : v >= 5.5 ? 34 : v >= 4 ? 26 : 18;
        }

        function createMovieCircleEl(movie) {
            const item = document.createElement("div");
            item.className = "movie-circle-item";
            item.setAttribute("data-id", movie.id);
            const diameter = getCircleRadius(movie.myRating) * 2;
            item.style.width = `${diameter}px`;
            item.style.height = `${diameter}px`;

            if (movie.loaded) {
                item.style.backgroundImage = `url('${movie.posterUrl}')`;
                item.classList.add("loaded");
                bindTooltip(item, movie);
            }
            return item;
        }

        function packCirclesFlat(movies, width, height) {
            const nodes = movies.map(movie => ({
                movie,
                r: getCircleRadius(movie.myRating) + 3,
                x: 0,
                y: 0
            }));

            const placed = [];
            const cx = width / 2;
            const cy = height / 2;

            for (let node of nodes) {
                let angle = 0, distance = 0;
                while (true) {
                    const x = cx + distance * Math.cos(angle);
                    const y = cy + distance * Math.sin(angle);
                    if (!placed.some(o => Math.hypot(x - o.x, y - o.y) < node.r + o.r)) {
                        node.x = x;
                        node.y = y;
                        placed.push(node);
                        break;
                    }
                    angle += 0.15;
                    distance += 0.5;
                }
            }
            return placed;
        }

        function initMoviesPlaceholder() {
            fetchedMovies = Array.from(document.querySelectorAll(".movie-entry")).map(e => ({
                id: e.dataset.tmdbId,
                myRating: parseFloat(e.dataset.myRating),
                title: "Loading...",
                year: "",
                posterUrl: "",
                loaded: false
            })).sort(() => Math.random() - 0.5);

            renderCirclesCluster();
            fetchMoviesProgressively();
        }

        async function fetchMoviesProgressively() {
            fetchedMovies.forEach(async (movie) => {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${API_KEY}&language=en-US`);
                    if (!res.ok) throw new Error();
                    const d = await res.json();

                    movie.title = d.title;
                    movie.year = d.release_date ? d.release_date.split("-")[0] : "N/A";
                    movie.posterUrl = d.poster_path ? `https://image.tmdb.org/t/p/w300${d.poster_path}` : '';
                    movie.loaded = true;

                    document.querySelectorAll(`[data-id="${movie.id}"]`).forEach(el => {
                        el.style.backgroundImage = `url('${movie.posterUrl}')`;
                        el.classList.add("loaded");
                        bindTooltip(el, movie);
                    });
                } catch (e) {}
            });
        }

        function renderCirclesCluster() {
            const container = document.getElementById("circles-inner-scale-box");
            container.innerHTML = "";
            const width = container.parentElement.clientWidth || 700;
            const height = container.parentElement.clientHeight || 450;
            const packed = packCirclesFlat(fetchedMovies, width, height);
            let maxDistance = 0;

            packed.forEach(node => {
                const item = createMovieCircleEl(node.movie);
                item.style.left = `${node.x - (node.r - 3)}px`;
                item.style.top = `${node.y - (node.r - 3)}px`;
                container.appendChild(item);
                const dist = Math.hypot(node.x - width / 2, node.y - height / 2) + node.r;
                if (dist > maxDistance) maxDistance = dist;
            });

            if (packed.length > 0) {
                const scale = Math.min((width - 20) / (maxDistance * 2), (height - 20) / (maxDistance * 2), 1);
                container.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }
        }

        function renderTiersGrid() {
            const tiers = [
                { min: 9.0, el: document.getElementById("tier-loved") },
                { min: 7.5, el: document.getElementById("tier-liked") },
                { min: 5.5, el: document.getElementById("tier-meh") },
                { min: 4.0, el: document.getElementById("tier-disliked") },
                { min: 0.0, el: document.getElementById("tier-trash") }
            ];
            tiers.forEach(t => t.el.innerHTML = "");
            fetchedMovies.forEach(movie => {
                const target = tiers.find(t => movie.myRating >= t.min);
                if (target) target.el.appendChild(createMovieCircleEl(movie));
            });
        }

        function bindTooltip(element, movie) {
            const tooltip = document.getElementById("flat-tooltip");
            const toggle = (show) => {
                if (!show) {
                    tooltip.style.opacity = "0";
                    return;
                }
                tooltip.innerHTML = `${movie.title} (${movie.year}) <span class="tooltip-rating-badge">${movie.myRating}</span>`;
                tooltip.style.opacity = "1";
                const r = element.getBoundingClientRect();
                let x = r.left + (r.width - tooltip.offsetWidth) / 2;
                x = Math.max(10, Math.min(x, window.innerWidth - tooltip.offsetWidth - 10));
                tooltip.style.left = `${x}px`;
                tooltip.style.top = `${r.top - tooltip.offsetHeight - 8}px`;
            };

            element.addEventListener("mouseenter", () => toggle(true));
            element.addEventListener("mouseleave", () => toggle(false));
            element.addEventListener("touchstart", () => toggle(true), { passive: true });
            element.addEventListener("touchend", () => toggle(false));
        }

        window.addEventListener("scroll", () => {
            document.getElementById("flat-tooltip").style.opacity = "0";
        });

        window.addEventListener("resize", () => {
            if (activeTab === 'circles') renderCirclesCluster();
        });

        document.addEventListener("DOMContentLoaded", initMoviesPlaceholder);
    </script>
</body>
</html>
