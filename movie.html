<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | Shakib Uz Zaman</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="logo.js" defer></script>
    <script src="background.js" defer></script>
    <script src="footer.js" defer></script>
    <style>
        ::selection {
            background-color: #ff7500;
            color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background-color: #000000;
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.8;
            position: relative;
            overflow-x: hidden;
            animation: pageFadeIn 0.4s ease-in-out;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        header {
            width: 100%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 90px;
            padding: 0 3%;
        }

        .left {
            display: flex;
            align-items: center;
        }

        .right ul {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .right ul li a {
            color: #b0b0b0;
            text-decoration: none;
            font-size: 1.0rem;
            transition: color 0.3s ease;
        }

        .right ul li a:hover {
            color: #ffffff;
        }

        .right ul li a i {
            display: none;
        }

        main {
            flex: 1;
            width: min(700px, 80%);
            margin: auto;
        }

        section {
            margin: 40px 0;
        }

        .watchlistSection h1 {
            font-size: 2.2rem;
            font-weight: 750;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }

        .watchlistSubtitle {
            color: #b0b0b0;
            font-size: 0.92rem;
            line-height: 1.7;
            max-width: 520px;
            margin-top: -15px;
            margin-bottom: 35px;
            letter-spacing: 0.2px;
        }

        .watchlistList {
            display: flex;
            flex-direction: column;
        }

        .sectionHeader {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .sectionHeading {
            color: #b0b0b0;
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sectionLine {
            flex-grow: 1;
            border-bottom: 1px solid #18181b;
            height: 1px;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (min-width: 1024px) {
            main {
                width: min(1100px, 85%); 
            }

            section {
                margin: 60px 0;
            }

            .watchlistSection h1 {
                font-size: 3.1rem;
                margin-bottom: 30px;
            }

            .watchlistSubtitle {
                font-size: 1.15rem;
                max-width: 650px;
                margin-top: -15px;
                margin-bottom: 45px;
            }

            .sectionHeader {
                margin-top: 35px;
                margin-bottom: 20px;
            }

            .sectionHeading {
                font-size: 1.05rem;
            }

            .right ul li a {
                font-size: 1.05rem;
            }
        }

        @media (max-width: 768px) {
            nav {
                height: 80px;
                padding: 0 6%;
            }

            .right ul li a span {
                display: none;
            }

            .right ul {
                gap: 22px;
            }

            .right ul li a i {
                display: block;
                color: #b0b0b0;
                font-size: 1.15rem;
                transition: color 0.3s ease;
            }

            .right ul li a:hover i {
                color: #ffffff;
            }

            main {
                width: 88%;
            }

            .watchlistSection h1 {
                font-size: 1.75rem;
            }

            .watchlistSubtitle {
                font-size: 1.02rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="left"></div>
            <div class="right">
                <ul>
                    <li>
                        <a href="blog.html" title="Blog">
                            <i class="fa-regular fa-newspaper"></i>
                            <span>Blog</span>
                        </a>
                    </li>
                    <li>
                        <a href="project.html" title="Projects">
                            <i class="fa-regular fa-folder"></i>
                            <span>Projects</span>
                        </a>
                    </li>
                    <li>
                        <a href="resources.html" title="Resources">
                            <i class="fa-regular fa-file-pdf"></i>
                            <span>Resources</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="watchlistSection">
            <h1>Watchlist</h1>
            <p class="watchlistSubtitle">
                My personal log of movies, series & animation, rated by me.
            </p>

            <div class="watchlistList">
                <div class="sectionHeader">
                    <h2 class="sectionHeading">Watched & Rated</h2>
                    <span class="sectionLine"></span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
