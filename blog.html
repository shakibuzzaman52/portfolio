<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Shakib Uz Zaman</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="background.js" defer></script>
    <script src="footer.js" defer></script>
    <style>
        ::selection {
            background-color: #ff7500;
            color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background-color: #000000;
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.8;
            position: relative;
            overflow-x: hidden;
            animation: pageFadeIn 0.4s ease-in-out;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        main {
            flex: 1;
            width: min(700px, 80%);
            margin: auto;
        }

        section {
            margin: 40px 0;
        }

        .blogSection h1 {
            font-size: 2.2rem;
            font-weight: 750;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }

        .blogSubtitle {
            color: #b0b0b0;
            font-size: 0.92rem;
            line-height: 1.7;
            max-width: 520px;
            margin-top: -15px;
            margin-bottom: 35px;
            letter-spacing: 0.2px;
        }

        .blogList {
            display: flex;
            flex-direction: column;
        }

        .sectionHeader {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .sectionHeading {
            color: #b0b0b0;
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sectionLine {
            flex-grow: 1;
            border-bottom: 1px solid #18181b;
            height: 1px;
        }

        .blogPost {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid #18181b;
            gap: 20px;
        }

        .blogPost:last-of-type {
            border-bottom: none;
        }

        .postLeft {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .postLink {
            font-family: "Inter", Arial, Helvetica, sans-serif;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 550;
            line-height: 1.4;
            transition: color 0.25s ease;
        }

        .postLink:hover {
            color: #b0b0b0;
        }

        .postDate {
            color: #b0b0b0;
            font-size: 0.85rem;
        }

        .postActionBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid #18181b;
            background-color: transparent;
            color: #b0b0b0;
            text-decoration: none;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .postActionBtn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }

        .postActionBtn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (min-width: 1024px) {
            main {
                width: min(1100px, 85%); 
            }

            section {
                margin: 60px 0;
            }

            .blogSection h1 {
                font-size: 3.1rem;
                margin-bottom: 30px;
            }

            .blogSubtitle {
                font-size: 1.15rem;
                max-width: 650px;
                margin-top: -15px;
                margin-bottom: 45px;
            }

            .sectionHeader {
                margin-top: 35px;
                margin-bottom: 20px;
            }

            .sectionHeading {
                font-size: 1.05rem;
            }

            .blogPost {
                padding: 32px 0;
            }

            .postLeft {
                gap: 8px;
            }

            .postLink {
                font-size: 1.25rem;
            }

            .postDate {
                font-size: 1.0rem;
            }

            .postActionBtn {
                width: 54px;
                height: 54px;
            }

            .postActionBtn svg {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 768px) {
            main {
                width: 88%;
            }

            .blogSection h1 {
                font-size: 1.75rem;
            }

            .blogSubtitle {
                font-size: 1.02rem;
            }

            .blogPost {
                padding: 18px 0;
            }

            .postLink {
                font-size: 1.05rem;
            }

            .postDate {
                font-size: 0.82rem;
            }

            .postActionBtn {
                width: 42px;
                height: 42px;
            }

            .postActionBtn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>
    <script src="logo.js"></script>

    <main>
        <section class="blogSection">
            <h1>Blog</h1>
            <p class="blogSubtitle">
                My journey, thoughts, and experiences.
            </p>

            <div class="blogList">
                <div class="sectionHeader">
                    <h2 class="sectionHeading">FROM THE BLOG — 2026</h2>
                    <span class="sectionLine"></span>
                </div>

                <article class="blogPost">
                    <div class="postLeft">
                        <a class="postLink" href="blog-nubcc-cp-bootcamp-certificate.html">
                            NUBCC CP Bootcamp Certificate 
                        </a>
                        <span class="postDate">August 13, 2026</span>
                    </div>
                    <a class="postActionBtn" href="blog-nubcc-cp-bootcamp-certificate.html" title="Read Post">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 10l5 5-5 5"/>
                            <path d="M4 4v7a4 4 0 0 0 4 4h12"/>
                        </svg>
                    </a>
                </article>

                <article class="blogPost">
                    <div class="postLeft">
                        <a class="postLink" href="blog-nub-shohoj-coding-cp-bootcamp.html">
                            Shohoj Coding CP Bootcamp (NUB) 
                        </a>
                        <span class="postDate">August 6, 2026</span>
                    </div>
                    <a class="postActionBtn" href="blog-nub-shohoj-coding-cp-bootcamp.html" title="Read Post">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 10l5 5-5 5"/>
                            <path d="M4 4v7a4 4 0 0 0 4 4h12"/>
                        </svg>
                    </a>
                </article>
                
                <article class="blogPost">
                    <div class="postLeft">
                        <a class="postLink" href="blog-cse-presentation-experience.html">
                            My CSE Presentation Experience
                        </a>
                        <span class="postDate">July 17, 2026</span>
                    </div>
                    <a class="postActionBtn" href="blog-cse-presentation-experience.html" title="Read Post">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 10l5 5-5 5"/>
                            <path d="M4 4v7a4 4 0 0 0 4 4h12"/>
                        </svg>
                    </a>
                </article>
            
                <article class="blogPost">
                    <div class="postLeft">
                        <a class="postLink" href="blog-first-programing-contest.html">
                            First Programming Contest Experience
                        </a>
                        <span class="postDate">July 10, 2026</span>
                    </div>
                    <a class="postActionBtn" href="blog-first-programing-contest.html" title="Read Post">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 10l5 5-5 5"/>
                            <path d="M4 4v7a4 4 0 0 0 4 4h12"/>
                        </svg>
                    </a>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
