<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Shakib Uz Zaman</title>

    <!-- Icon & Font Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Single Google Font Import: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- External Dynamic Scripts -->
    <script src="background.js" defer></script>
    <script src="footer.js" defer></script>

    <style>
        /* =======================
           RESET & BASE STYLES
        ======================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background-color: #000000;
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.8;
            -ms-overflow-style: none;
            position: relative;
            overflow-x: hidden;
            animation: pageFadeIn 0.4s ease-in-out;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        /* =======================
           HEADER & NAVIGATION
        ======================= */
        header {
            width: 100%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 90px;
            padding: 0 3%;
        }

        .left {
            display: flex;
            align-items: center;
        }

        /* Logo Box Styles */
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 2.5px solid #ffffff; 
            text-decoration: none;
            transition: opacity 0.2s ease;
            padding: 2px;
        }

        .logo-box:hover {
            opacity: 0.8;
        }

        /* Bold 'S' shape path styles */
        .logo-svg-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        .right ul {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .right ul li a {
            color: #999;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .right ul li a:hover {
            color: #ffffff;
        }

        .right ul li a i {
            display: none;
        }

        /* =======================
           MAIN LAYOUT
        ======================= */
        main {
            flex: 1;
            width: min(700px, 80%);
            margin: auto;
        }

        section {
            margin: 50px 0;
        }

        /* =======================
           BLOG SECTION
        ======================= */
        .blogSection h1 {
            font-size: 2.2rem;
            font-weight: 750;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }

        .blogSubtitle {
            color: #999;
            font-size: 0.92rem;
            line-height: 1.7;
            max-width: 520px;
            margin-top: -15px;
            margin-bottom: 35px;
            letter-spacing: 0.2px;
        }

        .blogList {
            display: flex;
            flex-direction: column;
        }

        /* Section Heading Divider */
        .sectionHeader {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .sectionHeading {
            color: #999;
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sectionLine {
            flex-grow: 1;
            border-bottom: 1px solid #18181b;
            height: 1px;
        }

        /* =======================
           BLOG POST LAYOUT
        ======================= */
        .blogPost {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid #18181b;
            gap: 20px;
        }

        .blogPost:last-of-type {
            border-bottom: none;
        }

        .postLeft {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .postLink {
            font-family: "Inter", Arial, Helvetica, sans-serif;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 550;
            line-height: 1.4;
            transition: color 0.25s ease;
        }

        .postLink:hover {
            color: #999;
        }

        .postDate {
            color: #999;
            font-size: 0.85rem;
        }

        .postActionBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid #18181b;
            background-color: transparent;
            color: #999;
            text-decoration: none;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .postActionBtn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            transition: transform 0.25s ease;
        }

        .postActionBtn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* =======================
           PAGE ANIMATION
        ======================= */
        @keyframes pageFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* =======================
           RESPONSIVE DESIGN
        ======================= */
        @media(max-width:768px) {
            nav {
                height: 80px;
                padding: 0 6%;
            }

            .right ul li a span {
                display: none;
            }

            .right ul {
                gap: 18px;
            }

            .right ul li a i {
                display: block;
                color: #999;
                font-size: 1.1rem;
                transition: color 0.3s ease;
            }

            .right ul li a:hover i {
                color: #ffffff;
            }

            main {
                width: 88%;
            }

            .blogSection h1 {
                font-size: 1.6rem;
            }

            .blogPost {
                padding: 18px 0;
            }

            .postLink {
                font-size: 1.05rem;
            }

            .postDate {
                font-size: 0.78rem;
            }

            .postActionBtn {
                width: 42px;
                height: 42px;
            }

            .postActionBtn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

        </section>
    </main>
</body>
</html>
